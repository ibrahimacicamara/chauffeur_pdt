name: chauffeur
description: "Application Pro du Transport."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^6.10.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.6.0
  firebase_messaging: ^16.0.0
  cloud_functions: ^6.0.0
  flutter:
    sdk: flutter
  hive_flutter: ^1.1.0
  geolocator: ^14.0.2
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  wakelock_plus: ^1.8.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/pro_du_transport.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/OFL.txt
    - assets/data/monuments_ile_de_france.json
